<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        پیگیری درخواست خدمات نظافتی | انتخاب نیک
    </title>

    <meta
        name="description"
        content="پیگیری وضعیت درخواست خدمات نظافتی ثبت‌شده در شرکت خدماتی نظافتی انتخاب نیک با استفاده از شماره پیگیری."
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="tracking-page">


        <!-- =========================================
             سربرگ
        ========================================== -->

        <section class="page-header">

            <div class="page-header-box">

                <h1>
                    پیگیری درخواست
                </h1>

                <p>
                    وضعیت درخواست خدمات خود را بررسی کنید.
                </p>

            </div>

        </section>


        <!-- =========================================
             فرم پیگیری
        ========================================== -->

        <section class="tracking-content">

            <div class="tracking-card">

                <div class="tracking-icon">
                    🔎
                </div>

                <h2>
                    پیگیری درخواست خدمات
                </h2>

                <p class="tracking-description">

                    شماره پیگیری درخواست خود را وارد کنید
                    تا بتوانید وضعیت درخواست خدمات خود را
                    مشاهده کنید.

                </p>


                <div class="form-group">

                    <label for="tracking-number">

                        شماره پیگیری

                    </label>

                    <input
                        type="text"
                        id="tracking-number"
                        placeholder="مثلاً NK-20260810-1234"
                        autocomplete="off"
                        dir="ltr"
                    >

                </div>


                <button
                    type="button"
                    id="tracking-search"
                    class="tracking-button"
                >

                    پیگیری درخواست

                </button>


                <!-- نتیجه پیگیری -->

                <div
                    id="tracking-result"
                    class="tracking-result"
                ></div>


            </div>

        </section>


        <!-- =========================================
             بازگشت
        ========================================== -->

        <div class="back-home">

            <a href="index.html">

                بازگشت به صفحه اصلی

            </a>

        </div>


    </main>


    <!-- =========================================
         فوتر
    ========================================== -->

    <footer class="footer">

        <div class="footer-bottom">

            <p>

                © شرکت خدماتی نظافتی انتخاب نیک

            </p>

        </div>

    </footer>


    <script src="js/tracking.js"></script>

</body>

</html>
