plugins {
    id 'com.android.application'
}

android {
    namespace 'com.entekhabnik.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.entekhabnik.app'
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("KEY_ALIAS")

            if (keystorePath && keystorePassword && keyAlias) {
                storeFile file(keystorePath)
                storePassword = keystorePassword
                keyAlias = keyAlias
                keyPassword = keystorePassword
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
