plugins {
    id 'com.android.application'
}

android {
    namespace 'com.entekhabnik.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.entekhabnik.app'
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def envKeystorePath = System.getenv("KEYSTORE_PATH")
            def envKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
            def envKeyAlias = System.getenv("KEY_ALIAS")

            if (envKeystorePath && envKeystorePassword && envKeyAlias) {
                storeFile file(envKeystorePath)
                storePassword = envKeystorePassword
                keyAlias = envKeyAlias
                keyPassword = envKeystorePassword
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
